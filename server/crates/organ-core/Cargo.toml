[package]
name = "organ-core"
description = "Platform-independent organ MIDI engine: device I/O, recording and playback."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["audio"]
# Play the simulator through the machine's sound output (WASAPI/CoreAudio/ALSA).
audio = ["dep:cpal"]

[dependencies]
cpal = { workspace = true, optional = true }
midir.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
utoipa.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Media"] }
