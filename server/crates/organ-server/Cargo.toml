[package]
name = "organ-server"
description = "Headless HTTP/WebSocket API around organ-core."
version.workspace = true
edition.workspace = true
license.workspace = true

# `cargo deb -p organ-server` (after `npm run build` in web/) makes the
# Raspberry Pi package. Data lives in /var/lib/registra; your music is kept
# when the package is upgraded or removed.
[package.metadata.deb]
name = "registra"
maintainer = "Registra contributors"
copyright = "Registra contributors, MIT licence"
extended-description = "Records, edits and plays back organ performances over MIDI, with a web interface for phones and tablets."
section = "sound"
priority = "optional"
depends = "$auto, adduser, libasound2"
maintainer-scripts = "../../../packaging/debian/"
conf-files = ["/etc/default/registra"]
assets = [
    ["target/release/organ-server", "usr/bin/", "755"],
    ["../../../web/out/**/*", "usr/share/registra/web/", "644"],
    ["../../../packaging/registra.service", "lib/systemd/system/registra.service", "644"],
    ["../../../packaging/registra.default", "etc/default/registra", "644"],
]

[lib]
path = "src/lib.rs"

[[bin]]
name = "organ-server"
path = "src/main.rs"

[dependencies]
organ-core.workspace = true
anyhow.workspace = true
axum.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
sha2 = "0.10"
getrandom = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies"] }
tempfile = "3"
