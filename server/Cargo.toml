[workspace]
resolver = "2"
members = ["crates/organ-core", "crates/organ-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
organ-core = { path = "crates/organ-core" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
cpal = "0.15"
dirs = "6"
midir = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = "5"

[profile.release]
lto = true
codegen-units = 1
strip = true
