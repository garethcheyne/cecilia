name: Release

# Push a tag like v0.2.0 to build packages for the Raspberry Pi (64- and
# 32-bit Pi OS), Linux PCs and Windows, and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with: { name: web, path: web/out }

  linux:
    needs: web
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf, x86_64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web, path: web/out }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - name: Tools
        run: cargo install cross cargo-deb --locked
      - name: Build
        working-directory: server
        run: cross build --release --target ${{ matrix.target }} -p organ-server
      - name: Package
        working-directory: server
        run: cargo deb -p organ-server --no-build --target ${{ matrix.target }}
      - uses: softprops/action-gh-release@v2
        with:
          files: server/target/${{ matrix.target }}/debian/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.target }}
          path: server/target/${{ matrix.target }}/debian/*.deb

  # A ready-to-flash SD card: Raspberry Pi OS Lite (64-bit) plus Cecilia.
  pi-image:
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb-aarch64-unknown-linux-gnu
          path: debs
      - name: Put the package where the image stage expects it
        run: |
          mkdir -p packaging/pi-gen/stage-cecilia/00-cecilia/files
          cp debs/*.deb packaging/pi-gen/stage-cecilia/00-cecilia/files/cecilia.deb
      - uses: usimd/pi-gen-action@v1
        id: build
        with:
          image-name: cecilia-pi-arm64
          pi-gen-version: arm64
          release: bookworm
          stage-list: stage0 stage1 stage2 ./packaging/pi-gen/stage-cecilia
          hostname: cecilia
          username: organist
          password: cecilia
          enable-ssh: 1
          locale: en_GB.UTF-8
          compression: xz
          export-last-stage-only: true
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.image-path }}

  windows:
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web, path: web/out }
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p organ-server
        working-directory: server
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/cecilia | Out-Null
          Copy-Item server/target/release/cecilia.exe dist/cecilia/
          Copy-Item -Recurse web/out dist/cecilia/web
          Compress-Archive dist/cecilia cecilia-windows-x64.zip
      - uses: softprops/action-gh-release@v2
        with: { files: cecilia-windows-x64.zip }
